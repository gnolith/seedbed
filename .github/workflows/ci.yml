name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-node
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:packed
      - run: npm run test:compose
      - run: npm run test:docker
      - name: Prove no application-image publication surface
        shell: bash
        run: |
          test ! -f .github/workflows/release.yml
          test ! -f Dockerfile
          ! grep -R -E 'docker (push|buildx.*--push)|ghcr\.io/gnolith/seedbed' .github scripts package.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/dependency-review-action@0b969e231c7fa715f7c59c9b62c07487be3c3bf9
        with:
          fail-on-severity: high
