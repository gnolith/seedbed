name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:packed
      - run: npm run test:compose
      - run: npm run test:docker
      - name: Prove no application-image publication surface
        shell: bash
        run: |
          test ! -f .github/workflows/release.yml
          test ! -f Dockerfile
          ! grep -R -E 'docker (push|buildx.*--push)|ghcr\.io/gnolith/seedbed' .github scripts package.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@56339e523c0409420f6c2c9a2f4292bbb3c07dd3
        with:
          fail-on-severity: high

  exact-handoffs:
    if: always()
    needs: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the complete candidate matrix
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
        run: test "$CANDIDATE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node
      - run: npm ci --ignore-scripts
      - name: Recompute exact package, graph, bundle, SBOM, and publication boundaries
        run: |
          npm run build
          npm run candidate:refresh-attestation
          git diff --exit-code
          npm run test:packed
          npm run check:sbom
          npm run check:publication
